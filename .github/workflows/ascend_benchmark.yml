name: Ascend Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ascend_benchmark.yml"
      - "src/liger_kernel/ops/backends/_ascend/**"
      - "benchmark/**"

  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ascend_benchmark.yml"
      - "src/liger_kernel/ops/backends/_ascend/**"
      - "benchmark/**"

  workflow_dispatch:
    inputs:
      runner:
        required: true
        type: choice
        options:
          - linux-aarch64-a2-1
          - linux-aarch64-a2-2
          - linux-aarch64-a2-4
          - linux-aarch64-a2-8
        default: "linux-aarch64-a2-1"
        description: "Runner selected"

      exclude:
        required: false
        type: string
        default: ""
        description: "Space-separated benchmark files to exclude"

  schedule:
    - cron: "0 8,22 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-2' }}

    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.5.0-910b-ubuntu22.04-py3.11
      options: >-
        --privileged
        -v /dev/davinci_manager:/dev/davinci_manager
        -v /dev/devmm_svm:/dev/devmm_svm
        -v /dev/hisi_hdc:/dev/hisi_hdc
        --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Liger-Kernel
        uses: actions/checkout@v4
        with:
          repository: linkedin/Liger-Kernel
          path: Liger-Kernel

      - name: Setup Python deps
        working-directory: Liger-Kernel
        run: |
          pip install -e .[dev]

      - name: Install torch_npu and dependencies
        run: |
          pip install attrs==24.2.0 numpy==1.26.4 scipy==1.13.1 decorator==5.1.1 psutil==6.0.0 pytest==9.0.2 pytest-xdist==3.6.1 pyyaml pybind11 transformers==5.3.0
          pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch_npu==2.6.0
          pip install triton-ascend==3.2.0

      - name: Run benchmarks
        working-directory: Liger-Kernel
        env:
          TORCH_COMPILE_DISABLE: "1"
          EXCLUDE: >
            benchmark/scripts/benchmark_mhc.py
            benchmark/scripts/benchmark_mhc_lm.py
            benchmark/scripts/benchmark_embedding.py
            benchmark/scripts/benchmark_multi_token_attention.py
            benchmark/scripts/benchmark_sparse_multi_token_attention.py
            benchmark/scripts/benchmark_swiglu.py
        run: |
          echo "EXCLUDE=$EXCLUDE"
          make run-benchmarks EXCLUDE="$EXCLUDE"
